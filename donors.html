<!DOCTYPE html>
<html>
<head>
    <title>Donate Blood - Life Savers Blood Bank</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>🩸 Life Savers Blood Bank</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="donors.html">Donate Blood</a>
        <a href="blood-availability.html">Availability</a>
        <a href="request-blood.html">Request Blood</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="donor">
    <h2>Donate Blood</h2>

    <p>
        Your blood donation can save someone's life.
        Register as a blood donor by filling out the form below.
    </p>

    <form id="donorForm">

        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <br><br>

        <label>Age:</label>
        <input type="number" placeholder="Enter your age">

        <br><br>

        <label>Gender:</label>
        <select>
            <option>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <br><br>

        <label>Blood Group:</label>
        <select>
            <option>Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>

        <br><br>

        <label>Phone Number:</label>
        <input type="tel" placeholder="Enter phone number">

        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter email">

        <br><br>

        <label>Address:</label>
        <textarea placeholder="Enter your address"></textarea>

        <br><br>

        <label>Last Blood Donation Date:</label>
        <input type="date">

        <br><br>

        <button type="submit">Register as Donor</button>

    </form>
</section>

<footer>
    <p>© 2026 Life Savers Blood Bank</p>
    <p>Emergency Contact: 1800-XXX-XXXX</p>
</footer>
<script>
document.getElementById("donorForm").addEventListener("submit", function(event) {

    event.preventDefault();

    var donor = {
        name: document.querySelector('input[placeholder="Enter your name"]').value,
        age: document.querySelector('input[placeholder="Enter your age"]').value,
        gender: document.querySelector("select").value,
        bloodGroup: document.querySelectorAll("select")[1].value,
        phone: document.querySelector('input[placeholder="Enter phone number"]').value,
        email: document.querySelector('input[placeholder="Enter email"]').value,
        address: document.querySelector("textarea").value,
        lastDonation: document.querySelector('input[type="date"]').value
    };

    fetch("https://blood-bank-4twl.onrender.com/donors", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(donor)
})
.then(response => {
    if (response.ok) {
        alert("Successfully Registered!");
    } else {
        alert("Registration failed!");
    }
})
.catch(error => {
    alert("Could not connect to the server!");
});
});
</script>
</body>
</html>
