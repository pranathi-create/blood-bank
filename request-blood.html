<!DOCTYPE html>
<html>
<head>
    <title>Request Blood - Life Savers Blood Bank</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>🩸 Life Savers Blood Bank</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="donors.html">Donate Blood</a>
        <a href="blood-donation.html">Blood Donation</a>
        <a href="blood-availability.html">Availability</a>
        <a href="request-blood.html">Request Blood</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="request">

    <h2>Request Blood</h2>

    <p>
        If you or someone you know needs blood,
        fill in the form below to request blood.
    </p>

    <form id="requestForm">

        <label>Patient Name:</label>
        <input type="text" placeholder="Enter patient name">

        <br><br>

        <label>Hospital Name:</label>
        <input type="text" placeholder="Enter hospital name">

        <br><br>

        <label>Blood Group:</label>
        <select>
            <option>Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>

        <br><br>

        <label>Units Required:</label>
        <input type="number" placeholder="Enter number of units">

        <br><br>

        <label>Contact Number:</label>
        <input type="tel" placeholder="Enter phone number">

        <br><br>

        <label>Patient Address:</label>
        <textarea placeholder="Enter address"></textarea>

        <br><br>

        <label>Urgency:</label>
        <select>
            <option>Select Urgency</option>
            <option>Normal</option>
            <option>Urgent</option>
            <option>Emergency</option>
        </select>

        <br><br>

        <button type="submit">Submit Blood Request</button>

    </form>

</section>

<footer>
    <p>© 2026 Life Savers Blood Bank</p>
    <p>Emergency Contact: 1800-XXX-XXXX</p>
</footer>

<script>
document.getElementById("requestForm").addEventListener("submit", function(event) {

    event.preventDefault();

    var request = {
        patientName: document.querySelector('input[placeholder="Enter patient name"]').value,
        hospitalName: document.querySelector('input[placeholder="Enter hospital name"]').value,
        bloodGroup: document.querySelectorAll("select")[0].value,
        unitsRequired: document.querySelector('input[placeholder="Enter number of units"]').value,
        contactNumber: document.querySelector('input[placeholder="Enter phone number"]').value,
        address: document.querySelector("textarea").value,
        urgency: document.querySelectorAll("select")[1].value
    };

    fetch("http://localhost:3000/requests", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(request)
    })
    .then(response => response.json())
    .then(data => {
        alert(data.message);
        document.getElementById("requestForm").reset();
    })
    .catch(error => {
        alert("Could not connect to the server.");
    });

});
</script>

</body>
</html>
