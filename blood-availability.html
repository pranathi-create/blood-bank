<!DOCTYPE html>
<html>
<head>
    <title>Blood Availability - Life Savers Blood Bank</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>🩸 Life Savers Blood Bank</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="donors.html">Donate Blood</a>
        <a href="blood-donation.html">Blood Donation</a>
        <a href="blood-availability.html">Availability</a>
        <a href="request-blood.html">Request Blood</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section>

    <h2>Blood Availability</h2>

    <table border="1" cellpadding="10" style="margin:auto;">
        <thead>
            <tr>
                <th>Blood Group</th>
                <th>Available Units</th>
            </tr>
        </thead>

        <tbody id="bloodTable">
        </tbody>
    </table>

</section>

<footer>
    <p>© 2026 Life Savers Blood Bank</p>
    <p>Emergency Contact: 1800-XXX-XXXX</p>
</footer>

<script>
fetch("http://localhost:3000/blood")
.then(response => response.json())
.then(data => {

    var table = document.getElementById("bloodTable");

    data.forEach(function(blood) {

        table.innerHTML +=
        "<tr>" +
        "<td>" + blood.bloodGroup + "</td>" +
        "<td>" + blood.units + "</td>" +
        "</tr>";

    });

})
.catch(error => {
    document.getElementById("bloodTable").innerHTML =
    "<tr><td colspan='2'>Could not connect to the server</td></tr>";
});
</script>

</body>
</html>
